<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    <style>
      :root { color-scheme: light dark; --paper: #ffffff; --ink: #1e2b28; --muted: #64716c; --border: #dfe7e2; --accent: #166b57; --surface: #f3f7f4; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.85; }
      main { width: min(100%, 900px); margin: 0 auto; padding: 56px 28px 72px; }
      h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.4; letter-spacing: -.03em; margin: 0 0 20px; }
      h2 { font-size: 21px; line-height: 1.5; margin: 36px 0 14px; }
      p { margin: 14px 0; }
      li { margin: 6px 0; }
      a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; }
      ul { padding-left: 1.5em; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 20px 0; }
      th, td { padding: 12px 14px; border: 1px solid var(--border); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
      th { background: var(--surface); }
      td:first-child { width: 32%; }
      code { padding: 2px 4px; border-radius: 4px; background: var(--surface); font-size: .9em; overflow-wrap: anywhere; }
      hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
      footer { padding-top: 20px; margin-top: 40px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
      @media (max-width: 520px) { main { padding: 30px 18px 48px; } th, td { padding: 9px 8px; } }
      @media (prefers-color-scheme: dark) { :root { --paper: #141b18; --ink: #e6ede9; --muted: #a0b1a7; --border: #334039; --accent: #8fd7b7; --surface: #202b25; } }
      @media print { :root { --paper: white; --ink: black; --border: #aaa; --accent: black; --surface: #eee; } main { max-width: none; padding: 0; } footer { display: none; } h2 { break-after: avoid; } tr { break-inside: avoid; } }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
      <footer>流浪猫 · 浏览器扩展隐私政策</footer>
    </main>
  </body>
</html>
